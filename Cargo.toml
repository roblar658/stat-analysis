[package]
name = "stat-analysis"
version = "0.1.0"
edition = "2021"
description = "stat-analysis: Profesjonelt desktop-program i ren Rust (egui) for automatisk og manuell statistisk forutsetningssjekk, modellkvalitet og visualisering"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
egui_plot = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
nalgebra = "0.33"
statrs = "0.18"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = false
strip = true
opt-level = "s"
